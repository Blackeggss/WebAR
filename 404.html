<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ページが見つかりません</title>
    <meta http-equiv="refresh" content="4;url=https://blackeggss.github.io/WebAR/public/">
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: #05060a;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 32px;
            box-sizing: border-box;
        }
        p {
            white-space: pre-line;
            line-height: 1.9;
            font-size: 16px;
            max-width: 420px;
            margin: 0;
        }
    </style>
</head>
<body>
    <p id="not_found_text"></p>
    <script>
        var remaining = 4;
        var textEl = document.getElementById('not_found_text');
        function render() {
            textEl.textContent = 'ページが見つかりません。\nURLが間違っている可能性があります。\n' + remaining + '秒後に制限されたページへ移動します。';
        }
        render();
        var timer = setInterval(function () {
            remaining -= 1;
            if (remaining <= 0) {
                clearInterval(timer);
                window.location.href = 'https://blackeggss.github.io/WebAR/public/';
                return;
            }
            render();
        }, 1000);
    </script>
</body>
</html>
