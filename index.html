<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>WebAR</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://storage.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <link rel="stylesheet" href="css/style.css">

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
      }
    </script>
</head>
<body>

    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output_canvas"></canvas>

    <div id="camera_controls">
        <!-- シャッターボタン -->
        <button id="shutter_btn" aria-label="撮影する">
            <span class="shutter_inner"></span>
        </button>

        <!-- カメラ切り替えボタン -->
        <button id="switch_camera_btn" aria-label="カメラを切り替える">
            <svg class="switch_icon" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M23 4v6h-6"/>
                <path d="M1 20v-6h6"/>
                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
            </svg>
        </button>
    </div>

    <!-- PC専用カメラ選択 -->
    <div id="camera_picker" hidden>
        <div id="camera_picker_title">カメラを選択</div>
        <ul id="camera_picker_list"></ul>
    </div>

    <!-- ローディング表示 -->
    <div id="ar_loading">
        <span class="ar_loading_spinner"></span>
        <span class="ar_loading_text">AR読み込み中…</span>
    </div>

    <!-- シャッター時フラッシュ -->
    <div id="flash_overlay"></div>

    <!-- トースト -->
    <div id="toast"></div>

    <!-- モーション許可オーバーレイ -->
    <div id="motion_permission_overlay" hidden>
        <div id="tap_icon" aria-hidden="true">
            <svg viewBox="0 0 80 110" width="64" height="88">
                <circle class="tap_ripple" cx="40" cy="90" r="10" fill="none" stroke="#fff" stroke-width="3"/>
                <g class="tap_hand" fill="#fff">
                    <!-- 親指 -->
                    <rect x="9" y="24" width="20" height="24" rx="9"/>
                    <!-- 握りこぶし -->
                    <rect x="20" y="8" width="42" height="38" rx="16"/>
                    <!-- 人差し指 -->
                    <rect x="32" y="38" width="16" height="46" rx="8"/>
                </g>
            </svg>
        </div>
        <span id="motion_permission_text">タップして開始</span>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
