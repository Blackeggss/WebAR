<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>WebAR</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://storage.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <link rel="stylesheet" href="css/style.css">

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
      }
    </script>
</head>
<body>

    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output_canvas"></canvas>

    <div id="camera_controls">
        <!-- ギャラリーボタン(シャッターボタンを挟んでカメラ切り替えボタンと対称の位置) -->
        <button id="gallery_btn" aria-label="撮影した写真を見る">
            <img id="gallery_btn_thumb" alt="">
        </button>

        <!-- シャッターボタン -->
        <button id="shutter_btn" aria-label="撮影する">
            <span class="shutter_inner"></span>
        </button>

        <!-- カメラ切り替えボタン -->
        <button id="switch_camera_btn" aria-label="カメラを切り替える">
            <svg class="switch_icon" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M23 4v6h-6"/>
                <path d="M1 20v-6h6"/>
                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
            </svg>
        </button>
    </div>

    <!-- PC専用カメラ選択 -->
    <div id="camera_picker" hidden>
        <div id="camera_picker_title">カメラを選択</div>
        <ul id="camera_picker_list"></ul>
    </div>

    <!-- ローディング表示 -->
    <div id="ar_loading">
        <span class="ar_loading_spinner"></span>
        <span class="ar_loading_text">AR読み込み中…</span>
    </div>

    <!-- シャッター時フラッシュ -->
    <div id="flash_overlay"></div>

    <!-- トースト -->
    <div id="toast"></div>

    <!-- 撮影済み写真ギャラリー -->
    <div id="gallery_overlay" hidden>
        <div id="gallery_stage">
            <img id="gallery_main_img" alt="">
            <div id="gallery_date_toast">
                <div id="gallery_date_line"></div>
                <div id="gallery_time_line"></div>
            </div>
        </div>

        <div id="gallery_thumb_strip"></div>

        <div id="gallery_toolbar">
            <button id="gallery_download_one_btn" aria-label="この写真をダウンロード">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 3v12"/>
                    <path d="M7 10l5 5 5-5"/>
                    <path d="M4 19h16"/>
                </svg>
            </button>

            <button id="gallery_download_all_btn" aria-label="すべての写真をダウンロード">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="4" y="3" width="12" height="9" rx="1.5"/>
                    <rect x="8" y="7" width="12" height="9" rx="1.5"/>
                    <path d="M14 20l0-6.5"/>
                    <path d="M10.8 16.8L14 20l3.2-3.2"/>
                </svg>
                <span>すべて保存</span>
            </button>

            <button id="gallery_delete_btn" aria-label="この写真を削除">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 7h16"/>
                    <path d="M9 7V4.5A1.5 1.5 0 0 1 10.5 3h3A1.5 1.5 0 0 1 15 4.5V7"/>
                    <path d="M6 7l1 12.5A2 2 0 0 0 9 21h6a2 2 0 0 0 2-2.5L18 7"/>
                    <path d="M10 11v6"/>
                    <path d="M14 11v6"/>
                </svg>
            </button>
        </div>

        <button id="gallery_close_btn" aria-label="閉じる">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M5 5l14 14"/>
                <path d="M19 5L5 19"/>
            </svg>
        </button>
    </div>

    <!-- モーション許可オーバーレイ -->
    <div id="motion_permission_overlay" hidden>
        <div id="tap_icon" aria-hidden="true">
            <svg viewBox="0 -65 200 275" xmlns="http://www.w3.org/2000/svg">
                <g class="hand">
                    <path
                        d="
                            M 72 167
                            C 65 165, 61 160, 61 153
                            L 61 145
                            L 30 111
                            C 24 104, 25 94, 32 89
                            C 38 84, 47 85, 53 91
                            L 65 103
                            L 65 12
                            C 65 3, 71 -3, 79 -3
                            C 87 -3, 93 3, 93 12
                            L 93 86
                            L 93 73
                            C 93 50, 99 44, 107 44
                            C 115 44, 121 50, 121 73
                            L 121 89
                            L 121 84
                            C 121 61, 127 55, 135 55
                            C 143 55, 149 61, 149 84
                            L 149 98
                            L 149 94
                            C 149 71, 155 65, 163 65
                            C 171 65, 177 71, 177 94
                            L 177 125
                            C 177 136, 174 143, 169 151
                            C 164 160, 155 166, 145 169
                            C 124 175, 94 175, 72 167
                            Z
                        "
                        fill="none"
                        stroke="white"
                        stroke-width="7"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                    <path class="finger_line" d="M 93 86 L 93 12" />
                    <path class="finger_line" d="M 121 89 L 121 73" />
                    <path class="finger_line" d="M 149 98 L 149 84" />
                </g>
            </svg>
            <span class="tap_ripple"></span>
            <span class="tap_dot"></span>
        </div>
        <span id="motion_permission_text">タップして開始</span>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
